name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction

    - name: Run unit tests
      run: |
        poetry run python3 -m unittest discover -s tests/unit -t .

    - name: Run integration tests
      run: |
        ANSIBLE_CONFIG=tests/integration/ansible.cfg poetry run ansible-playbook tests/integration/playbooks/verify.yml

    - name: Run integration tests with user config
      run: |
        mkdir -p ~/group_vars ~/host_vars
        cp tests/integration/group_vars/all.yml ~/group_vars/
        cp tests/integration/host_vars/localhost.yml ~/host_vars/
        ANSIBLE_CONFIG=tests/integration/ansible-user.cfg poetry run ansible-playbook tests/integration/playbooks/verify.yml
